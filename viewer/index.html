<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CookieRun: Braverse — visual player</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/builder.css">
</head>
<body>

<header class="bar">
  <div class="brand">CookieRun<span>: Braverse</span></div>
  <nav class="tabs">
    <button id="tab-play" class="tab on">Play</button>
    <button id="tab-build" class="tab">Deck builder</button>
  </nav>
  <div class="turnline" id="turnline">idle</div>
  <div class="controls">
    <button id="btn-pause" class="ghost" title="Pause / resume the bots">Pause</button>
    <button id="btn-step" class="ghost" title="Advance one bot decision">Step</button>
    <label class="speed" title="Delay between bot decisions">
      speed
      <input id="speed" type="range" min="0" max="2000" step="50" value="700">
      <span id="speed-label">0.7s</span>
    </label>
    <label class="check" title="Show both hands (HP piles stay face down until revealed)">
      <input id="reveal" type="checkbox"> reveal
    </label>
    <label class="check" title="Show the opponent's mat rotated, as it would sit across the table">
      <input id="flipopp" type="checkbox" checked> flip opp.
    </label>
    <label class="check" title="Card flicks, hits and breaks">
      <input id="sound" type="checkbox" checked> sound
    </label>
    <button id="btn-new" class="primary">New match</button>
  </div>
</header>

<main id="table">
  <section class="side opponent" id="side-1"></section>
  <div class="middle">
    <div class="banner" id="banner"></div>
    <div class="endturn hidden" id="endturn"></div>
  </div>
  <section class="side me" id="side-0"></section>
  <div class="fx" id="fx"></div>
</main>

<aside class="panel">
  <div class="panel-head">
    <h2 id="prompt">…</h2>
    <div class="who" id="prompt-who"></div>
  </div>
  <div id="reveals" class="reveals hidden"></div>
  <div id="options" class="options"></div>
  <div class="log-head">
    <h3>Log</h3>
    <button id="btn-copy-log" class="ghost tiny">copy</button>
  </div>
  <ol id="log" class="log"></ol>
</aside>

<section id="builder" class="builder">
  <div class="pool">
    <div class="pool-bar">
      <input id="pool-q" type="search" placeholder="search name, id or rules text…" autocomplete="off">
      <select id="pool-type"><option value="">any type</option></select>
      <select id="pool-color"><option value="">any colour</option></select>
      <select id="pool-set"><option value="">any set</option></select>
      <label class="check" title="Only cards whose printed effect the engine plays; the rest are treated as vanilla bodies">
        <input id="pool-playable" type="checkbox" checked> playable
      </label>
    </div>
    <div class="pool-count" id="pool-count">…</div>
    <div class="pool-grid" id="pool-grid"></div>
    <div class="pager">
      <button id="pool-prev" class="ghost tiny">‹ prev</button>
      <span id="pool-page"></span>
      <button id="pool-next" class="ghost tiny">next ›</button>
    </div>
  </div>

  <aside class="deckpane">
    <div class="deck-bar">
      <input id="deck-name" type="text" placeholder="deck name" autocomplete="off" maxlength="60">
      <button id="deck-save" class="primary">Save</button>
    </div>
    <div class="deck-bar">
      <select id="deck-load"><option value="">load a deck…</option></select>
      <button id="deck-new" class="ghost tiny">New</button>
      <button id="deck-copy" class="ghost tiny" title="Copy the decklist to the clipboard">Copy</button>
      <button id="deck-delete" class="ghost tiny">Delete</button>
    </div>
    <div class="deck-meter"><div id="deck-fill"></div></div>
    <div class="deck-status" id="deck-status"></div>
    <div class="deck-mix" id="deck-mix"></div>
    <div class="decklist" id="decklist"></div>
    <div class="deck-hint">click a card to add · click a row's card to remove one</div>
  </aside>
</section>

<div id="centre" class="centre hidden"></div>

<div id="picker" class="picker hidden"></div>

<div id="preview" class="preview hidden"></div>

<dialog id="browser">
  <div class="browser-head">
    <h2 id="browser-title">Trash</h2>
    <input id="browser-search" type="search" placeholder="search name, type or rules text…" autocomplete="off">
    <button id="browser-close" class="ghost">Close</button>
  </div>
  <div class="browser-count" id="browser-count"></div>
  <div class="browser-grid" id="browser-grid"></div>
</dialog>

<dialog id="setup">
  <form method="dialog" id="setup-form">
    <h2>New match</h2>
    <div class="grid">
      <div class="seat">
        <h3>Seat 0 <span class="tag">goes first</span></h3>
        <label>pilot <select id="pilot0"></select></label>
        <label>deck <select id="deck0"></select></label>
        <div class="deckinfo" id="deckinfo0"></div>
      </div>
      <div class="seat">
        <h3>Seat 1</h3>
        <label>pilot <select id="pilot1"></select></label>
        <label>deck <select id="deck1"></select></label>
        <div class="deckinfo" id="deckinfo1"></div>
      </div>
    </div>
    <label class="row">seed <input id="seed" type="number" placeholder="random"></label>
    <label class="row check"><input id="start-paused" type="checkbox"> start paused</label>
    <p class="hint" id="setup-hint"></p>
    <menu>
      <button value="cancel" class="ghost">Cancel</button>
      <button value="start" id="start" class="primary">Start</button>
    </menu>
  </form>
</dialog>

<script src="/sfx.js"></script>
<script src="/app.js"></script>
<script src="/builder.js"></script>
</body>
</html>
