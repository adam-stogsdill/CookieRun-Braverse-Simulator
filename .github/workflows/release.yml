# Builds the standalone player on both platforms at once, because
# `build_release.py` can only ever build for the machine it runs on.
#
# Run it from the Actions tab, or push a `v*` tag. Artifacts land on the run;
# a tag build also drafts a release with both zips attached.

name: build player

on:
  workflow_dispatch:
    inputs:
      card_art:
        description: "Fetch and bundle the card art (~190 MB per binary, slow)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # card_images/ is gitignored, so a build with art has to fetch it first.
      - name: Fetch card art
        if: inputs.card_art
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-play.txt
          python fetch_images.py

      - name: Build
        run: python build_release.py ${{ inputs.card_art && '--webview' || '--no-images --webview' }}

      - uses: actions/upload-artifact@v4
        with:
          name: braverse-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*.zip
